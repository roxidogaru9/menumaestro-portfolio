name: menumaestro

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: u3iGTeLr
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./main-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      - backend

volumes:
  postgres-data:
